[workspace]
members = [
  "feather-ui",
  # "feather-ui/examples/basic-alc",
  # "feather-ui/examples/calculator-rs",
  # "feather-ui/examples/calculator-alc", # This breaks cargo for some reason
  "feather-macro",
]
resolver = "2"
default-members = ["feather-ui", "feather-macro"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"
homepage = "https://github.com/Fundament-Software/feathergui"
repository = "https://github.com/Fundament-Software/feathergui/"
readme = "README.md"

[workspace.dependencies]
imbl = "8.0"
wgpu = "26"
winit = "0.30"
eyre = "0.6"
feather-ui = { path = "feather-ui" }
alicorn = "0.1.2"
feather-macro = { version = "0.4", path = "feather-macro" }
cosmic-text = { version = "0.14.2" }

[workspace.lints]

[patch.crates-io]
cosmic-text = { git = "https://github.com/pop-os/cosmic-text", rev = "355b7febb17ecb0522346fcc5aff6ea78e33e78a" }
imbl = { git = "https://github.com/Fundament-Institute/imbl" }

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
